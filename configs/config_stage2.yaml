train_id: no0
load_checkpoint: None

# dataset
rootdir: ./dataset_pca
dataset: PCADataset
num_classes: 2
val_fold: None
test_fold: None

# train:
trainer: BaseTrainer
optimizer: Rmsprop
batch_size: 64
num_epochs: 50
ckpt_freq: 5
ckpt: None # path to checkpoint file
learning_rate: 0.001
weight_decay: 0.0
# LƯU Ý: loss_type ở đây hiện KHÔNG được trainer_utils.py đọc (dead
# field) — trainer tự quyết định loss dựa trên model_utils.py.SHLNN.
# Paper (Section III-C) mô tả SHLNN dùng Sigmoid output, nên mặc định
# code giờ dùng BCELoss + Sigmoid cho SHLNN, KHÁC với "CrossEntropy"
# ghi ở đây (có thể chỉ là copy từ config ArcNN, chưa chắc chủ đích).
# Muốn khớp đúng CrossEntropy như dòng dưới ghi (bỏ Sigmoid), thêm:
#   sigmoid_output: false
# vào mục SHLNN bên dưới.
loss_type: CrossEntropy


# models
model: SHLNN
SHLNN:
  num_inputs: 70
  # sigmoid_output: true   # mặc định (paper Section III-C). Đặt false
  #                          để khớp đúng "loss_type: CrossEntropy" ở
  #                          trên thay vì paper — xem ghi chú phía trên.
